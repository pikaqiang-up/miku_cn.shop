  <style>

    *{box-sizing:border-box}html,body{min-height:100%;margin:0}body{display:grid;place-items:center;padding:28px;background:radial-gradient(ellipse at 18% 18%,rgba(57,197,187,.14),transparent 36%),radial-gradient(ellipse at 85% 82%,rgba(57,197,187,.08),transparent 36%),var(--paper);color:var(--ink);font-family:var(--sans)}

    p{max-width:34em;color:var(--muted);font-size:14px;line-height:2.1}.jp{margin-top:30px;color:#238f87;letter-spacing:.16em}
    a{display:inline-flex;align-items:center;gap:14px;margin-top:34px;padding:12px 0;border-bottom:1px solid rgba(57,197,187,.65);color:#176f69;font:11px var(--mono);letter-spacing:.12em;text-decoration:none}
