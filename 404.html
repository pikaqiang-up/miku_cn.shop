<script>
  /* 和主站同一套判断：本地有手动选择就照做，没有则跟随系统（浏览器）。
     顺手把 data-theme-state 一起写上，两个页面的状态机不会各说各话。 */
  (function () {
    var root = document.documentElement;
    var mq = window.matchMedia ? window.matchMedia('(prefers-color-scheme: dark)') : null;
    var KEY = 'miku-space-theme';

    function savedTheme() {
      try {
        var value = localStorage.getItem(KEY);
        return (value === 'light' || value === 'dark') ? value : 'system';
      } catch (e) { return 'system'; /* 隐私模式可能禁用存储 */ }
    }
    function addMeta(content, media) {
      var meta = document.createElement('meta');
      meta.setAttribute('name', 'theme-color');
      meta.setAttribute('content', content);
      if (media) meta.setAttribute('media', media);
      document.head.appendChild(meta);
    }
    function apply(state) {
      var dark = state === 'dark' || (state === 'system' && !!(mq && mq.matches));
      root.setAttribute('data-theme-state', state);
      root.setAttribute('data-theme', dark ? 'dark' : 'light');

      /* 状态栏配色：跟随时交给双 media，浏览器自己挑；手动指定时换成单一 meta，
         否则系统口味与选择相反时地址栏会配错色 */
      var metas = document.querySelectorAll('meta[name="theme-color"]');
      if (state === 'system') {
        if (metas.length === 1) {
          metas[0].parentNode.removeChild(metas[0]);
          addMeta('#f8fbfa', '(prefers-color-scheme: light)');
          addMeta('#091311', '(prefers-color-scheme: dark)');
        }
      } else if (metas.length === 1 && !metas[0].getAttribute('media')) {
        metas[0].setAttribute('content', dark ? '#091311' : '#f8fbfa');
      } else {
        for (var i = metas.length - 1; i >= 0; i--) metas[i].parentNode.removeChild(metas[i]);
        addMeta(dark ? '#091311' : '#f8fbfa', null);
      }
    }

    apply(savedTheme());

    /* 停在 404 页时也照常跟随：系统口味变了，或者主站在别的标签页切了主题 */
    if (mq) {
      var onChange = function () {
        if (root.getAttribute('data-theme-state') === 'system') apply('system');
      };
      if (typeof mq.addEventListener === 'function') mq.addEventListener('change', onChange);
      else if (typeof mq.addListener === 'function') mq.addListener(onChange); /* 旧版 Safari */
    }
    window.addEventListener('storage', function (event) {
      if (event.key === KEY || event.key === null) apply(savedTheme());
    });
  })();
</script>
<style>
  :root {
    color-scheme: light;
    --paper: #f8fbfa;
    --ink: #0f1614;
    --ink-2: #3d4744;
    --ink-3: #5e6a66;
    --accent-ink: #087b73;
    --pink: #d75d83;
    --line: rgba(15, 34, 30, .12);
    --line-2: rgba(15, 34, 30, .24);
    --tint: rgba(12, 110, 103, .06);
    --meta: #4f5b57;
    --sans: -apple-system, BlinkMacSystemFont, "SF Pro SC", "PingFang SC", "HarmonyOS Sans SC", "MiSans", "Noto Sans SC", "Noto Sans CJK SC", "Microsoft YaHei", system-ui, sans-serif;
    --mono: ui-monospace, "SF Mono", "JetBrains Mono", Menlo, Consolas, "Noto Sans Mono CJK SC", monospace;
  }
  * { box-sizing: border-box; }
  html, body { min-height: 100%; margin: 0; }
  body { overflow-x: clip; }
  body {
    min-height: 100svh;
    display: grid; place-items: center;
    padding: clamp(24px, 5vw, 64px);
    background: var(--paper); color: var(--ink-2);
    font: 400 17px/1.8 var(--sans); letter-spacing: .01em;
    -webkit-font-smoothing: antialiased;
  }
  a { -webkit-tap-highlight-color: transparent; }
  :focus-visible { outline: 2px solid var(--accent-ink); outline-offset: 3px; border-radius: 4px; }

  main {
    width: min(1120px, 100%);
    display: grid;
    grid-template-columns: minmax(0, 1.02fr) minmax(0, .98fr);
    grid-template-rows: auto auto;
    align-items: center;
    gap: clamp(28px, 4vw, 56px) clamp(32px, 5vw, 64px);
  }
  .copy { grid-area: 1 / 1; }
  .stage { grid-area: 1 / 2; }
  .foot { grid-area: 2 / 1 / 3 / -1; }

  .kicker {
    display: flex; align-items: center; gap: 10px;
    margin: 0 0 clamp(14px, 2.4vw, 22px);
    font-family: var(--mono); font-size: 11px;
    letter-spacing: .16em; text-transform: uppercase; color: var(--ink-3);
  }
  .kicker b { color: var(--accent-ink); font-weight: 500; }
  .kicker i { display: block; width: 22px; height: 1px; background: var(--line-2); }

  h1 {
    margin: 0;
    font-size: clamp(96px, 14vw, 176px);
    font-weight: 600; line-height: .86; letter-spacing: -.06em;
    color: var(--ink);
    font-variant-numeric: tabular-nums;
  }

  .lede {
    margin: clamp(20px, 3vw, 30px) 0 0;
    font-size: clamp(21px, 2.4vw, 26px);
    line-height: 1.55; letter-spacing: -.01em;
    color: var(--ink);
  }
  .sub em { display: block; margin-top: 6px; }
  .jp-cn { display: block; margin-top: 3px; font-size: 11px; font-style: normal; letter-spacing: .06em; opacity: .8; }
  .sub {
    margin: 14px 0 0; max-width: 30em;
    font-size: 15px; line-height: 1.95; color: var(--ink-3);
    text-wrap: pretty;
  }
  .sub em { font-style: normal; color: var(--ink-2); }

  /* 把用户实际访问的地址显示出来，省得他反复检查自己有没有打错 */
  .missed {
    display: flex; align-items: baseline; gap: 8px; flex-wrap: wrap;
    margin: 14px 0 0;
    font-family: var(--mono); font-size: 11.5px; letter-spacing: .03em;
    color: var(--ink-3);
  }
  .missed::before { content: "↳"; flex: none; color: var(--pink); }
  .missed b { font-weight: 400; color: var(--ink-2); overflow-wrap: anywhere; }
  .missed[hidden] { display: none; }

  /* 地址里出现了「song」「gloss」这类词，就顺手指出那一节在哪 */
  .hint {
    margin: 16px 0 0; padding: 11px 15px;
    border-radius: 12px; background: var(--tint);
    font-size: 14px; line-height: 1.75; color: var(--ink-2);
  }
  .hint[hidden] { display: none; }
  .hint b { font-weight: 500; color: var(--ink); }
  .hint a {
    color: var(--accent-ink); text-decoration: none; white-space: nowrap;
    border-bottom: 1px solid transparent; transition: border-color .2s ease;
  }
  .hint a:hover { border-bottom-color: currentColor; }
  .hint a::after { content: " →"; }

  .actions {
    display: flex; align-items: center; flex-wrap: wrap; gap: 14px clamp(20px, 3vw, 32px);
    margin-top: clamp(26px, 4vw, 38px);
  }
  a.btn {
    display: inline-flex; align-items: center; gap: 9px;
    height: 48px; padding: 0 26px;
    border-radius: 999px;
    background: var(--accent-ink); color: #fff;
    font-size: 14px; font-weight: 500; text-decoration: none;
    transition: background-color .2s ease, transform .2s ease;
  }
  a.btn:hover { transform: translateY(-1px); background: #0a5d57; }
  a.btn svg { width: 16px; height: 16px; fill: none; stroke: currentColor; stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; }

  /* 七个入口单独占一行：跟按钮挤在同一行时，宽度一窄就被压成两行 */
  .mini { flex: 1 1 100%; display: flex; flex-wrap: wrap; gap: 6px 14px; font-family: var(--mono); font-size: 11.5px; letter-spacing: .06em; }
  .mini a {
    color: var(--ink-3); text-decoration: none;
    border-bottom: 1px solid transparent; padding-bottom: 2px;
    transition: color .2s ease, border-color .2s ease;
  }
  .mini a:hover { color: var(--accent-ink); border-bottom-color: var(--line-2); }
  .mini span { color: var(--line-2); }

  .foot {
    display: flex; justify-content: space-between; align-items: baseline; gap: 12px 20px; flex-wrap: wrap;
    margin: 0;
    padding-top: 18px; border-top: 1px solid var(--line);
    font-family: var(--mono); font-size: 11px; letter-spacing: .08em;
    text-transform: uppercase; color: var(--meta);
  }
  .foot .jp { letter-spacing: .18em; text-transform: none; font-family: var(--sans); font-size: 12px; }
  .foot .code { display: inline-flex; align-items: center; gap: 8px; text-transform: none; letter-spacing: .1em; }
  .foot .code::before {
    content: ""; width: 5px; height: 5px; border-radius: 50%;
    background: var(--pink); opacity: .8;
  }

  /* 声纹：走到中间断掉，右边只剩轨道 */
  .stage { position: relative; }
  .wave { display: block; width: 112%; height: auto; margin-left: -4%; overflow: visible; }
  .wave rect { fill: var(--accent-ink); }
  .wave .axis { stroke: var(--line); stroke-width: 1; }
  .wave .lost-ring { fill: none; stroke: var(--pink); stroke-width: 1; opacity: .5; transform-box: fill-box; transform-origin: center; }
  .wave .pulse { animation: signal-lost 3.6s ease-in-out infinite; }
  .wave .track { stroke: var(--ink-2); stroke-width: 1.1; stroke-dasharray: 2 8; opacity: .78; }
  .wave .lost { fill: var(--pink); }
  .wave rect {
    transform-box: fill-box; transform-origin: center;
    animation: bar-in .5s cubic-bezier(.22, .68, .3, 1) both;
    animation-delay: calc(var(--i, 0) * 7ms);
  }
  .wave .track { animation: fade-in .5s ease .62s both; }
  @keyframes bar-in {
    from { transform: scaleY(.06); opacity: 0; }
    to { transform: scaleY(1); opacity: 1; }
  }
  @keyframes fade-in { from { opacity: 0; } to { opacity: .78; } }
  @keyframes signal-lost {
    0%, 100% { opacity: .5; transform: scale(1); }
    50% { opacity: .12; transform: scale(1.55); }
  }

  :root[data-theme="dark"] {
    color-scheme: dark;
    --paper: #091311; --ink: #f1f5f3; --ink-2: #c2ccc8; --ink-3: #9aa8a3;
    --accent-ink: #79e5db; --pink: #f090ab;
    --line: rgba(213, 235, 228, .14); --line-2: rgba(213, 235, 228, .3);
    --tint: rgba(110, 217, 206, .12); --meta: #a9b7b2;
  }
  :root[data-theme="dark"] a.btn { color: #06201d; }
  :root[data-theme="dark"] a.btn:hover { background: #8fe6dc; }

  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      color-scheme: dark;
      --paper: #091311; --ink: #f1f5f3; --ink-2: #c2ccc8; --ink-3: #9aa8a3;
      --accent-ink: #79e5db; --pink: #f090ab;
      --line: rgba(213, 235, 228, .14); --line-2: rgba(213, 235, 228, .3);
      --tint: rgba(110, 217, 206, .12); --meta: #a9b7b2;
    }
    :root:not([data-theme="light"]) a.btn { color: #06201d; }
    :root:not([data-theme="light"]) a.btn:hover { background: #8fe6dc; }
  }

  /* 系统开了「增强对比度」：把分隔线与描边加深，和主站保持同一处理 */
  @media (prefers-contrast: more) {
    :root {
      --line: rgba(15, 34, 30, .3);
      --line-2: rgba(15, 34, 30, .55);
    }
    :root[data-theme="dark"] {
      --line: rgba(213, 235, 228, .34);
      --line-2: rgba(213, 235, 228, .62);
    }
    a.btn { outline: 2px solid transparent; }
  }

  @media (max-width: 860px) {
    /* 单列时清掉显式的网格定位，否则 col2 会撑出隐式列，把正文压窄 */
    main { grid-template-columns: 1fr; grid-template-rows: auto; gap: 4px; }
    .copy, .stage, .foot { grid-area: auto; }
    /* 单列时声纹不要撑满整屏，压到一个舒服的宽度 */
    .stage { margin-top: 18px; width: 100%; max-width: 480px; justify-self: center; }
    .wave { width: 100%; margin-left: 0; }
    h1 { font-size: clamp(88px, 22vw, 132px); }
    /* 三段信息在窄屏并排会互相挤，改成左对齐的短栈 */
    .foot { margin-top: 34px; flex-direction: column; align-items: flex-start; gap: 7px; }
  }

  @media (max-width: 480px) {
    /* 窄屏去掉分隔符，七个入口才排得进一行 */
    .mini { gap: 6px 12px; }
    .mini span { display: none; }
    .missed { font-size: 11px; }
    .hint { font-size: 13px; padding: 10px 13px; }
    .foot { gap: 8px; }
  }

  @media (prefers-reduced-motion: reduce) {
    * { transition: none !important; animation: none !important; }
  }
</style>

<script>
  (function () {
    /* 相对链接在两种情况下才对：本地打开、或直接访问 404.html（含子目录部署）。
       当页面是被服务器拿来顶替某个不存在的地址时，地址栏里可能是任意深度，
       相对路径会解析到错误的目录，这时改用站点根。 */
    var direct = /\/404(\.html)?$/i.test(location.pathname);
    var isFile = location.protocol === 'file:';
    var rootDir = (!isFile && !direct) ? location.origin + '/' : './';

    function homeHref(hash) {
      return rootDir + 'index.html' + (hash || '');
    }

    /* 地址里常常留着用户真正想找的东西：/songs、/glossary、/live……
       能认出来就直接指路，比让人再从七个入口里挑一遍有用。 */
    var ROUTES = [
      { keys: ['song', 'songs', 'music', 'track', 'tracks', 'album', 'albums', 'playlist', 'discography', 'songlist', 'lyrics'], zh: ['歌', '曲'], name: '代表作品', action: '前往作品列表', hash: '#songs' },
      { keys: ['glossary', 'gloss', 'word', 'words', 'term', 'terms', 'dictionary', 'dict', 'lexicon'], zh: ['词'], name: '词条', action: '查看词汇解释', hash: '#glossary' },
      { keys: ['people', 'person', 'creator', 'creators', 'producer', 'producers', 'author', 'authors', 'artist', 'artists'], zh: [], name: '创作者', action: '查看创作者介绍', hash: '#people' },
      { keys: ['live', 'stage', 'concert', 'concerts', 'tour', 'festival', 'setlist'], zh: ['现场', '演出', '演唱会'], name: '现场演出', action: '查看时间线', hash: '#history' },
      { keys: ['history', 'timeline', 'version', 'versions', 'software'], zh: ['时间', '版本'], name: '时间线', action: '查看发展历程', hash: '#history' },
      { keys: ['lab', 'wave', 'waves', 'sound', 'visual', 'visualizer', 'visualiser', 'voiceprint'], zh: ['声场'], name: '声场实验室', action: '进入互动区域', hash: '#lab' },
      { keys: ['about', 'story', 'intro', 'concept'], zh: ['序章'], name: '序章', action: '了解初音未来', hash: '#about' },
      { keys: ['message', 'note', 'notes', 'guestbook', 'letter', 'wall'], zh: ['留言'], name: '留言', action: '写下一段留言', hash: '#message' }
    ];

    function guess(raw) {
      var text;
      try { text = decodeURIComponent(raw).toLowerCase(); } catch (e) { text = raw.toLowerCase(); }
      if (text.indexOf('404') > -1) return null;
      var tokens = text.split(/[\/\-_.?=&]+/).filter(function (t) {
        return t.length > 1 || /[\u4e00-\u9fa5]/.test(t);
      });
      for (var i = 0; i < ROUTES.length; i++) {
        var route = ROUTES[i];
        for (var j = 0; j < tokens.length; j++) {
          if (route.keys.indexOf(tokens[j]) > -1) return route;
          for (var k = 0; k < route.zh.length; k++) {
            if (tokens[j].indexOf(route.zh[k]) > -1) return route;
          }
        }
      }
      return null;
    }

    var hit = guess(location.pathname);
    if (hit) {
      var name = document.querySelector('#hintName');
      var link = document.querySelector('#hintLink');
      if (name && link) {
        name.textContent = '「' + hit.name + '」';
        link.textContent = hit.action;
        link.setAttribute('data-home', hit.hash);
        link.href = homeHref(hit.hash);
        document.querySelector('#hint').hidden = false;
      }
    }

    if (!isFile && !direct) {
      document.querySelectorAll('a[data-home]').forEach(function (a) {
        a.href = homeHref(a.getAttribute('data-home'));
      });
      var icon = document.querySelector('link[data-asset]');
      if (icon) icon.href = rootDir + 'assets/' + icon.getAttribute('data-asset');
    }

    /* 显示他实际打开的地址（跳过了 404 页自身路径的情况） */
    try {
      var path = decodeURIComponent(location.pathname + location.search);
      var isPage = /\/404(\.html)?$/i.test(path) || path === '/';
      if (!isPage && path.length > 1) {
        var slot = document.querySelector('#missed');
        slot.querySelector('b').textContent = path;
        slot.hidden = false;
      }
    } catch (e) {}
  })();
</script>
